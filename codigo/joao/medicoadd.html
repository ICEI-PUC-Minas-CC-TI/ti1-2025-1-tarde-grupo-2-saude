<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <title>Adicionar médicos</title>
</head>

<body class="card">
    <form action="">
        <div class="mb-3">
            <label for="nameid" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nameid" aria-describedby="Nome">
        </div>
        <div class="mb-3">
            <label for="biografiaid" class="form-label">Biografia</label>
            <textarea class="form-control" id="biografiaid" rows="3"></textarea>
        </div>
        <label for="specialtySelect" class="form-label">Especialidade</label>
        <select class="form-control" id="specialtySelect" name="especialidade"></select>
        <div class="mb-3">
            <label for="photo" class="form-label">Foto de perfil (URL da imagem)</label>
            <input class="form-control" type="url" id="photo" 
            name="photo"placeholder="https://exemplo.com/imagem.jpg"pattern="https?://.*\.(jpg|jpeg|png|gif|webp)"
            required> 
        </div>
    </form>
    <script src="script.js"></script>
</body>

</html>
